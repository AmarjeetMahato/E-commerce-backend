services:
  postgres:
    container_name: postgres-container
    image: postgres:latest
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root123
      POSTGRES_DB: springboot
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
